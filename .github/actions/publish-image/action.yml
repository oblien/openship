name: Publish an Openship image manifest
description: Publish the existing native digest artifacts; verify the protected worker before consumers ship.
inputs:
  image:
    required: true
    description: The image component built by docker-images.yml.
  token:
    required: true
    description: The publishing job's GHCR token.
runs:
  using: composite
  steps:
    - name: Setup Bun for worker verification
      if: inputs.image == 'buildkit'
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: .bun-version
    - name: Verify the worker release version
      if: inputs.image == 'buildkit'
      shell: bash
      run: bun scripts/verify-buildkit-release.ts --version-only
    - name: Download digests
      uses: actions/download-artifact@v8
      with:
        pattern: digests-${{ inputs.image }}-*
        path: /tmp/digests
        merge-multiple: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    # Tag push → semver + :latest (auto: RCs like v1.2.3-rc.1 skip :latest).
    # Manual dispatch → the input tag (or short SHA), and NEVER :latest.
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository_owner }}/openship-${{ inputs.image }}
        tags: |
          type=semver,pattern={{version}},enable=${{ github.event_name == 'push' }}
          type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'push' }}
          type=semver,pattern={{major}},enable=${{ github.event_name == 'push' }}
          type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}
          type=sha,format=short,enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag == '' }}
        flavor: |
          latest=${{ github.event_name == 'push' && 'auto' || 'false' }}

    - name: Create manifest list + push
      shell: bash
      working-directory: /tmp/digests
      env:
        METADATA_JSON: ${{ steps.meta.outputs.json }}
        SRC: ghcr.io/${{ github.repository_owner }}/openship-${{ inputs.image }}
      run: |
        set -euo pipefail
        docker buildx imagetools create \
          $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$METADATA_JSON") \
          $(printf "${SRC}@sha256:%s " *)

    - name: Inspect
      shell: bash
      run: |
        docker buildx imagetools inspect \
          "ghcr.io/${{ github.repository_owner }}/openship-${{ inputs.image }}:${{ steps.meta.outputs.version }}" || true

    - name: Verify public protected worker artifacts
      if: inputs.image == 'buildkit'
      shell: bash
      env:
        OPENSHIP_BUILDKIT_RELEASE_IMAGE: ghcr.io/${{ github.repository_owner }}/openship-buildkit:${{ steps.meta.outputs.version }}
      run: bun scripts/verify-buildkit-release.ts
