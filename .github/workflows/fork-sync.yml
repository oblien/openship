name: Fork upstream sync

# ─────────────────────────────────────────────────────────────────────────────
# The fork's worker: keep a thin patch layer on top of pristine upstream.
#
#   weekly (or manual): fetch oblien/openship main → merge into a sync branch
#                       → guard our patches + run their tests → open a PR.
#                       Merge the PR, then push a fork-v* release tag to build
#                       images (fork-images.yml) and the CLI (fork-cli.yml).
#
# Conflict handling ("make fixes and keep our stuff"):
#   • rerere is ON and its memory (.git/rr-cache) is cached across runs — the
#     FIRST time you resolve a conflict in a file, record it with
#     `git rerere` locally (see docs/fork-maintenance.md) or let a manual run
#     of this workflow learn it; every later merge auto-resolves the same
#     hunk pair the same way.
#   • conflicts rerere cannot solve stop the job BEFORE anything is pushed:
#     a GitHub issue lists the files and the run link. Fix by hand, push, and
#     rerere remembers for next time.
#
# Patch safety: after every merge (clean or rerere-resolved), patch-guard.mjs
# asserts our three Podman patches are still structurally intact, then the
# type-check + their test files run. Any failure → issue, no push, no images.
#
# NOTES
#   • Actions must be enabled on the fork for `schedule:` to fire (Actions tab
#     → enable). GitHub also disables cron workflows after 60 days without
#     repo activity — the sync pushes themselves reset that clock.
#   • main is PR-only (ruleset `require-pr-on-default`), so this worker no
#     longer pushes main directly. It pushes a `fork-sync/upstream-<sha>`
#     branch and opens a PR. Publication is a separate fork-v* tag push after
#     merging. Do NOT chain artifact builds from this unmerged sync branch.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # Weekly, not daily: the merge+guard itself is cheap, but each sync used
    # to chain into build churn and queue noise on the small runner. Manual
    # dispatch below covers "sync now"; upstream drift between runs is
    # handled by rerere when the weekly merge conflicts.
    - cron: "23 4 * * 0" # Sundays, 04:23 UTC
  workflow_dispatch:

concurrency:
  group: fork-sync
  cancel-in-progress: false

permissions:
  contents: write # push the merge
  issues: write # open the "needs manual resolution" issue
  # NOTE: upstream merges that change .github/workflows/* are REJECTED with
  # "refusing to allow a GitHub App to create or update workflow …" — `workflows`
  # is an app-level permission the in-workflow `permissions:` map cannot grant
  # (an invalid key here makes the whole file unparseable, which silently killed
  # the schedule for two days). Those merges land in the manual loop below; a
  # PAT with the workflow scope could automate them if that ever hurts.

jobs:
  sync:
    name: Merge upstream/main
    # The Openship self-hosted runner (rootless podman VPS). Safe: this
    # workflow triggers only on schedule and manual dispatch — never
    # pull_request, so no untrusted code reaches the box.
    runs-on: [self-hosted, openship, linux, x64]
    timeout-minutes: 45
    outputs:
      merged: ${{ steps.decide.outputs.merged }}
      upstream: ${{ steps.fetch.outputs.upstream }}
    steps:
      - name: Checkout fork main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # merge needs history; rr-cache lives in .git

      # Best-effort on the self-hosted runner: actions/cache shells out to
      # zstd, which a slim runner image may not carry. Losing the rr-cache
      # only costs a manual conflict resolution next time (the issue loop
      # below covers it) — it must never fail the sync itself.
      - name: Restore rerere memory
        continue-on-error: true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .git/rr-cache
          key: rr-cache-${{ github.run_id }}
          restore-keys: |
            rr-cache-

      # Bun + gh are bootstrapped BEFORE the merge: the failure-path issue
      # steps below need gh, and bun replaces every system-node assumption
      # (the runner container has none).
      - name: Read pinned Bun version
        run: echo "BUN_VERSION=$(cat .bun-version)" >> "$GITHUB_ENV"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "${{ env.BUN_VERSION }}"

      # No gh CLI in the runner image. Fetched via bun — no curl/wget assumed.
      - name: Install gh CLI
        run: |
          set -eu
          command -v gh >/dev/null 2>&1 && { echo "gh already present"; exit 0; }
          dir="$RUNNER_TEMP/gh"
          mkdir -p "$dir"
          GH_DIR="$dir" bun -e '
            const release = await (await fetch(
              "https://api.github.com/repos/cli/cli/releases/latest",
              { headers: { "user-agent": "fork-sync-ci" } },
            )).json();
            const asset = release.assets
              .map((a) => a.name)
              .find((n) => /^gh_.+_linux_amd64\.tar\.gz$/.test(n));
            if (!asset) throw new Error("no linux amd64 gh asset in " + release.tag_name);
            const url = `https://github.com/cli/cli/releases/download/${release.tag_name}/${asset}`;
            // Bun.write(Response) — NOT .blob(): the pinned Bun (1.3.14)
            // stringifies an unawaited Blob promise to "[object Promise]".
            const res = await fetch(url);
            if (!res.ok) throw new Error(`gh download HTTP ${res.status}`);
            await Bun.write(`${process.env.GH_DIR}/gh.tar.gz`, res);
            console.log(`fetched ${asset}`);
          '
          tar -xzf "$dir/gh.tar.gz" -C "$dir" --strip-components=1
          echo "$dir/bin" >> "$GITHUB_PATH"

      - name: Fetch upstream
        id: fetch
        run: |
          set -eu
          git config user.name "fork-sync[bot]"
          git config user.email "fork-sync[bot]@users.noreply.github.com"
          git config rerere.enabled true
          git remote add upstream https://github.com/oblien/openship.git
          git fetch upstream main
          echo "upstream=$(git rev-parse --short upstream/main)" >> "$GITHUB_OUTPUT"
          echo "behind=$(git rev-list --count HEAD..upstream/main)" >> "$GITHUB_OUTPUT"

      - name: Decide whether to merge
        id: decide
        run: |
          if [ "${{ steps.fetch.outputs.behind }}" = "0" ]; then
            echo "merged=false" >> "$GITHUB_OUTPUT"
            echo "Already contains upstream/main (${{ steps.fetch.outputs.upstream }}) — nothing to merge."
          else
            echo "merged=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream/main
        if: steps.decide.outputs.merged == 'true'
        id: merge
        run: |
          set -euo pipefail
          echo "Merging upstream/main (${{ steps.fetch.outputs.upstream }})…"
          # rerere (enabled in the Fetch step) replays memorized resolutions, and
          # autoUpdate STAGES them — but `git merge` still exits non-zero whenever
          # it hit a conflict, even a fully-replayed one, leaving MERGE_HEAD
          # behind. So: empty unmerged list after a failed merge = rerere solved
          # everything, and the merge must be COMPLETED here. Only a NON-empty
          # list is a genuine novel conflict.
          git config rerere.autoUpdate true
          if ! git merge --no-edit upstream/main; then
            if [ -z "$(git diff --name-only --diff-filter=U)" ]; then
              echo "rerere replayed every conflict; completing the merge."
              git commit --no-edit
            else
              {
                echo "## Upstream sync needs manual conflict resolution"
                echo ""
                echo "Merge of \`oblien/openship@${{ steps.fetch.outputs.upstream }}\` into fork main conflicted and rerere could not resolve everything."
                echo ""
                echo "**Unmerged files:**"
                git diff --name-only --diff-filter=U | awk '{ print "- `" $0 "`" }'
                echo ""
                echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                echo ""
                echo "Fix (see docs/fork-maintenance.md): merge locally, keep our patches where upstream only moved code, then push. \`git rerere\` records the resolution so this never asks again."
              } > /tmp/issue-body.md
              echo "conflicted=true" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi
          echo "conflicted=false" >> "$GITHUB_OUTPUT"
          echo "Merge clean (rerere may have replayed and completed memorized resolutions)."

      - name: Open (or update) the conflict issue
        if: failure() && steps.merge.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # REST, not `gh issue create/comment`: the GraphQL mutations those
          # wrap are refused for the Actions installation token ("Resource not
          # accessible by integration", createIssue) — the failure that turned
          # the Oct/Nov 2026 conflicts into three silent weeks.
          export ISSUE_TITLE="upstream sync needs manual conflict resolution"
          existing="$(gh api "repos/$REPO/issues?state=open&per_page=100" \
            --jq '[.[] | select(.title == env.ISSUE_TITLE) | .number][0]')"
          if [ -n "$existing" ]; then
            gh api --method POST "repos/$REPO/issues/$existing/comments" \
              -F body="$(cat /tmp/issue-body.md)" >/dev/null
          else
            gh api --method POST "repos/$REPO/issues" \
              -f title="upstream sync needs manual conflict resolution" \
              -F body="$(cat /tmp/issue-body.md)" >/dev/null
          fi

      # A guard failure means the merge LANDED but our patches broke — different
      # message, same loop: nothing was pushed; fix locally, push, rerere remembers.
      - name: Open (or update) the patch-guard issue
        if: failure() && steps.merge.outcome != 'failure' && steps.decide.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cat > /tmp/guard-issue.md <<'EOF'
          ## Upstream merge broke a fork patch (or its tests)

          The merge itself was clean, but the patch guard / type-check / tests
          failed afterwards — upstream refactored code our patches live in.
          **Nothing was pushed and no images were built.**

          See the failed step in the run log, and docs/fork-maintenance.md
          ("when a merge breaks a patch").

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          # REST for the same installation-token reason as the conflict issue.
          export ISSUE_TITLE="upstream merge broke a fork patch"
          existing="$(gh api "repos/$REPO/issues?state=open&per_page=100" \
            --jq '[.[] | select(.title == env.ISSUE_TITLE) | .number][0]')"
          if [ -n "$existing" ]; then
            gh api --method POST "repos/$REPO/issues/$existing/comments" \
              -F body="$(cat /tmp/guard-issue.md)" >/dev/null
          else
            gh api --method POST "repos/$REPO/issues" \
              -f title="upstream merge broke a fork patch" \
              -F body="$(cat /tmp/guard-issue.md)" >/dev/null
          fi

      # ── Guards: OUR patches + the code they live in still work ────────────
      - name: Install dependencies
        if: steps.decide.outputs.merged == 'true'
        run: bun install --frozen-lockfile

      - name: Patch guard (are our seven patches still intact?)
        if: steps.decide.outputs.merged == 'true'
        run: bun scripts/fork/patch-guard.mjs

      - name: Type-check the patched package
        if: steps.decide.outputs.merged == 'true'
        working-directory: packages/adapters
        run: bunx tsc --noEmit -p tsconfig.json

      - name: Run the patches' tests
        if: steps.decide.outputs.merged == 'true'
        working-directory: packages/adapters
        run: |
          bunx vitest run \
            src/runtime/docker-builder-mode.test.ts \
            src/runtime/docker-build-cancellation.test.ts \
            src/infra/nginx.test.ts \
            src/infra/edge-baked-conf.test.ts \
            src/system/docker-check.test.ts

      # ── Publish: hand the merge over as a pull request ────────────────────
      # Save rr-cache AFTER a successful merge too — a rerere resolution only
      # gets memorized when the merge that recorded it completes. Best-effort
      # (see the restore step above).
      - name: Save rerere memory
        continue-on-error: true
        if: steps.decide.outputs.merged == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .git/rr-cache
          key: rr-cache-${{ github.run_id }}

      - name: Push the sync branch
        if: steps.decide.outputs.merged == 'true'
        id: pushbranch
        run: |
          set -eu
          branch="fork-sync/upstream-${{ steps.fetch.outputs.upstream }}"
          # Force is safe: the branch is owned by this worker and rebuilt each
          # run. Only this branch is ever force-pushed; main is PR-only.
          git push origin "HEAD:refs/heads/$branch" --force
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open (or update) the sync pull request
        if: steps.decide.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ steps.pushbranch.outputs.branch }}
          UPSTREAM: ${{ steps.fetch.outputs.upstream }}
        run: |
          set -eu
          # REST, not `gh pr create`: the GraphQL mutations gh wraps are refused
          # for the Actions installation token — same reason the issue steps
          # above use `gh api`.
          body="$(printf '%s\n' \
            "Automated merge of [\`oblien/openship@${UPSTREAM}\`](https://github.com/oblien/openship/commit/${UPSTREAM}) into \`main\`." \
            "" \
            "Patch guard, type-check and the patched tests all passed before this branch was pushed." \
            "" \
            "**Merge, then release** — push a \`fork-v*\` tag to the merged commit to run \`fork-images\` and \`fork-cli\`.")"
          existing="$(gh api "repos/$REPO/pulls?state=open&head=$REPO:$BRANCH" --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh api --method POST "repos/$REPO/pulls/$existing/comments" -F body="$body" >/dev/null
            echo "updated the open sync PR (#$existing)"
          else
            gh api --method POST "repos/$REPO/pulls" \
              -f title="chore(fork): sync upstream ${UPSTREAM}" \
              -f head="$BRANCH" -f base=main -F body="$body" >/dev/null
            echo "opened a sync PR for $BRANCH"
          fi

