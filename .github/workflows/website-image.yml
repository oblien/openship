name: Website image

on:
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Production website build and startup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build the shipped website Dockerfile
        run: docker buildx build --load --progress=plain -f apps/web/Dockerfile -t openship-website:verify .
      - name: Verify public pages from the production image
        run: |
          set -euo pipefail
          container="openship-website-check-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker logs "$container" || true; docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$container" -e HOSTNAME=0.0.0.0 -e PORT=3000 -p 127.0.0.1::3000 openship-website:verify
          binding="$(docker port "$container" 3000/tcp)"
          base="http://${binding}"
          for attempt in $(seq 1 30); do
            if curl -fsS "$base/" -o /tmp/website-home.html; then break; fi
            sleep 1
          done
          test -s /tmp/website-home.html
          for path in / /ar /docs /docs/getting-started/installation /features /compare /mail /download /changelog /llms.txt; do
            curl --fail --silent --show-error --location "$base$path" -o /tmp/website-response
            test -s /tmp/website-response
            echo "Verified $path"
          done
