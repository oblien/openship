name: VS Code extension

on:
  pull_request:
    paths:
      - "apps/vscode/**"
      - "apps/web/public/openship.schema.json"
      - "apps/web/public/apple-touch-icon.png"
      - "LICENSE"
      - "packages/sdk/**"
      - "packages/contracts/**"
      - "packages/core/**"
      - "packages/platform/**"
      - "**/package.json"
      - "bun.lock"
      - "tsconfig.base.json"
      - ".github/workflows/vscode-extension.yml"
  push:
    branches: [main]
    paths:
      - "apps/vscode/**"
      - "apps/web/public/openship.schema.json"
      - "apps/web/public/apple-touch-icon.png"
      - "LICENSE"
      - "packages/sdk/**"
      - "packages/contracts/**"
      - "packages/core/**"
      - "packages/platform/**"
      - "**/package.json"
      - "bun.lock"
      - "tsconfig.base.json"
      - ".github/workflows/vscode-extension.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - name: Install dependencies
        run: bun install --frozen-lockfile --filter openship-vscode
      - name: Test extension workflows
        run: bun run --cwd apps/vscode test
      - name: Typecheck and package
        run: bun run --cwd apps/vscode package
      - name: Test packaged extension in VS Code
        run: |
          unzip -q apps/vscode/dist/openship-vscode-*.vsix -d "$RUNNER_TEMP/openship-vsix"
          OPENSHIP_EXTENSION_PATH="$RUNNER_TEMP/openship-vsix/extension" xvfb-run -a bun run --cwd apps/vscode test:host
      - uses: actions/upload-artifact@v7
        with:
          name: openship-vscode
          path: apps/vscode/dist/*.vsix
