name: Build macOS RU

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/macos-ru.yml'
      - 'apps/desktop/**'
      - 'apps/dashboard/**'
      - 'packages/core/**'
      - 'packages/onboarding/**'
      - 'bun.lock'
      - '.bun-version'

permissions:
  contents: read

concurrency:
  group: macos-ru-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build macOS arm64 + x64
    runs-on: macos-14

    steps:
      - name: Checkout fork
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # Avoid third-party GitHub Actions so this workflow also works when the
      # repository policy allows only GitHub-owned actions. Bun publishes its
      # native CLI through npm; pin it to the repository's .bun-version.
      - name: Install Bun
        shell: bash
        run: |
          set -euo pipefail
          npm install --global "bun@$(cat .bun-version)"
          bun --version

      - name: Restore Bun cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: macos-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            macos-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Mirror the proven commands from the release workflow. One native arm64
      # runner can package both Apple Silicon and Intel Electron targets.
      - name: Build Openship for macOS
        shell: bash
        run: |
          set -euo pipefail
          cd apps/desktop
          bun run build
          bunx electron-forge make --arch=arm64
          bunx electron-forge make --arch=x64

      - name: Collect DMGs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in arm64 x64; do
            DMG="apps/desktop/out/make/Openship-${arch}.dmg"
            if [ ! -f "$DMG" ]; then
              echo "Expected DMG not found: $DMG"
              find apps/desktop/out/make -maxdepth 6 -type f -print || true
              exit 1
            fi
            OUT="dist/Openship-RU-macOS-${arch}.dmg"
            cp "$DMG" "$OUT"
            shasum -a 256 "$OUT" > "$OUT.sha256"
          done

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: Openship-RU-macOS
          path: |
            dist/Openship-RU-macOS-arm64.dmg
            dist/Openship-RU-macOS-arm64.dmg.sha256
            dist/Openship-RU-macOS-x64.dmg
            dist/Openship-RU-macOS-x64.dmg.sha256
          if-no-files-found: error
          retention-days: 30
