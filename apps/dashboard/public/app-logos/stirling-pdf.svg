<!-- Stirling PDF's own favicon (Stirling-Tools/Stirling-PDF, app/core/.../static/favicon.svg).
     Its rx/ry="80" is dropped: this is a full-bleed mark, so AppLogo's `fill` renders it
     with rounded-[inherit] and the TILE supplies the radius — keeping the baked corners
     too would notch transparent bites out of an already-rounded tile. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#8E3131"/>
  <path d="M202 268L432 78V255L202 445V268Z" fill="#FFFFFF" fill-opacity="0.6"/>
  <path d="M79 256L309 66V242L79 432V256Z" fill="#FFFFFF"/>
</svg>
