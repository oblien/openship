; supervisord config for the openship-mail engine.
;
; Program NAMES here MUST match the `unit` values in
; apps/api/src/modules/mail/mail-health.service.ts (MAIL_COMPONENTS) and the
; targets used by admin/components.service.ts, because the API drives + probes
; these daemons via `docker exec openship-mail supervisorctl <action> <name>`.
;
; PostgreSQL is deliberately absent — it runs in the `openship-mail-db` sidecar.
[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

; ── syslog (must start first) ────────────────────────────────────────────────
; iRedMail's daemons log via syslog (dovecot=local5, postfix=mail) and iRedAPD
; opens /dev/log at startup — with no syslog daemon that socket never exists and
; iRedAPD FATALs. rsyslogd (imuxsock) creates /dev/log and routes each facility
; to the files fail2ban tails (see /etc/rsyslog.d/1-iredmail-*.conf). priority=1
; so it is up before any mail daemon writes its first log line.
[program:rsyslog]
command=/usr/sbin/rsyslogd -n
autorestart=true
priority=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/%(program_name)s.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

; ── log rotation (issue #1701) ───────────────────────────────────────────────
; The mail logs now persist on a host bind mount, so something has to rotate
; them: the rotation configs already ship in the image (rsyslog's, fail2ban's,
; iRedMail's dovecot/iredapd ones), but cron — while installed — was never
; started, so logrotate's daily job never fired. A plain `cron -f` under
; supervisord is the whole scheduler; supervisord's own logs are capped by
; logfile_maxbytes/logfile_backups above. `cron` is infrastructure, not a
; probed mail component: it deliberately has no entry in MAIL_COMPONENTS
; (mail-health.service.ts) and no admin action target.
[program:cron]
command=/usr/sbin/cron -f
autorestart=true
priority=5
redirect_stderr=true
stdout_logfile=/var/log/supervisor/%(program_name)s.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

; ── mail daemons ─────────────────────────────────────────────────────────────
; Each runs in the foreground (supervisord manages lifecycle). Commands are the
; Debian package binaries iRedMail installs; validate exact paths/flags on a
; Debian build host. Every program logs to /var/log/supervisor/<name>.log with
; stderr folded in, so admin/components.service.ts can `tail` it by unit name.

[program:postfix]
command=/usr/sbin/postfix -c /etc/postfix start-fg
autorestart=true
priority=20
redirect_stderr=true
stdout_logfile=/var/log/supervisor/%(program_name)s.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[program:dovecot]
# The entrypoint unlinks a leftover /var/run/dovecot/master.pid before we
# start: Dovecot refuses to start with "Dovecot is already running" if a
# docker-restart pid file still names a live non-dovecot process (usually
# amavisd), and IMAPS/POP3S stay down until someone removes it by hand.
command=/usr/sbin/dovecot -F
autorestart=true
priority=20
redirect_stderr=true
stdout_logfile=/var/log/supervisor/%(program_name)s.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[program:amavis]
# Debian's amavisd-new package installs the daemon as /usr/sbin/amavisd (there is
# no `amavisd-new` executable); `foreground` keeps it attached for supervisord.
# The entrypoint unlinks leftover /var/run/amavis/amavisd.{pid,lock,socket}
# before we start: Net::Server abort-loops if a docker-restart pid file still
# names a live non-amavis process (usually dovecot), and originating mail then
# defers on 127.0.0.1:10026.
command=/usr/sbin/amavisd foreground
autorestart=true
priority=30
redirect_stderr=true
stdout_logfile=/var/log/supervisor/%(program_name)s.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

; clamd exits 1 when its database directory holds no loadable signatures, and with the
; defaults (startretries=3, startsecs=1) supervisord spends all three retries in ~6s and
; marks the program FATAL — a state nothing retries for the life of the container, so a
; clamd that failed before freshclam finished stayed dead even once the signatures
; landed (issue #565). /var/lib/clamav is a bind mount, so an empty database directory
; is the ordinary state of a wiped or offline first boot; the entrypoint seeds it from
; the image, and freshclam keeps it current from there.
;
; startretries=100 rather than a wrapper that waits: supervisord's retry delay grows by
; a second each attempt, so 100 retries is roughly 84 minutes of patience — long enough
; for a first signature download on a slow link — and BACKOFF maps to `failed` in the
; Health tab, which is the truth. A wrapper that blocked on the database would instead
; be reported RUNNING while clamd had not been started at all.
;
; The program NAME must stay clamav-daemon: mail-health.service.ts probes it by name.
[program:clamav-daemon]
command=/usr/sbin/clamd --foreground=true
autorestart=true
startretries=100
priority=40
redirect_stderr=true
stdout_logfile=/var/log/supervisor/%(program_name)s.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

; priority 39 — starts BEFORE clamd on purpose: on a box whose signature mount was
; wiped, the fetch is already running while clamd burns its early retries. Its pid file
; is /var/run/clamav/freshclam.pid, the same directory clamd's socket lives in, which
; the entrypoint creates before supervisord starts. startretries matches clamd's: the
; default 3 would let a boot with no network yet FATAL freshclam permanently, and then
; the signatures never arrive at all.
[program:clamav-freshclam]
command=/usr/bin/freshclam -d --foreground=true
autorestart=true
startretries=100
priority=39
redirect_stderr=true
stdout_logfile=/var/log/supervisor/%(program_name)s.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[program:spamd]
command=/usr/sbin/spamd --nouser-config --max-children=2
autorestart=true
priority=40
redirect_stderr=true
stdout_logfile=/var/log/supervisor/%(program_name)s.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[program:iredapd]
; --foreground is REQUIRED under supervisord. iredapd.py daemonizes (double-fork +
; setsid) unless `--foreground` is on argv — its systemd unit is Type=forking and
; relies on that. Without the flag the foreground parent supervisord launches forks
; a backgrounded child and exits immediately; supervisord sees "exited too quickly",
; restarts it, and the still-running backgrounded daemon already holds 7777/7778/7779
; → the restart FATALs with EADDRINUSE in a crash loop. --foreground keeps the daemon
; attached so supervisord owns its lifecycle and the ports bind exactly once.
command=/usr/bin/python3 /opt/iredapd/iredapd.py --foreground
autorestart=true
priority=50
redirect_stderr=true
stdout_logfile=/var/log/supervisor/%(program_name)s.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[program:fail2ban]
command=/usr/bin/fail2ban-server -f -x
autorestart=true
priority=50
redirect_stderr=true
stdout_logfile=/var/log/supervisor/%(program_name)s.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
