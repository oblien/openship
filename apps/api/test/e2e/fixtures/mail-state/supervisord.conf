[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/run/supervisord.pid
[unix_http_server]
file=/run/supervisor.sock
[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface
[supervisorctl]
serverurl=unix:///run/supervisor.sock
[program:rsyslog]
command=/usr/sbin/rsyslogd -n
autorestart=true
priority=1
stdout_logfile=/var/log/supervisor/rsyslog.log
redirect_stderr=true
[program:cron]
command=/usr/sbin/cron -f
priority=5
stdout_logfile=/var/log/supervisor/cron.log
redirect_stderr=true
[program:fail2ban]
command=/usr/bin/fail2ban-server -f -x
priority=50
stdout_logfile=/var/log/supervisor/fail2ban.log
redirect_stderr=true
[program:clamav-freshclam]
command=/usr/bin/freshclam --daemon --foreground=true --no-dns
autostart=false
autorestart=true
stdout_logfile=/var/log/supervisor/freshclam.log
redirect_stderr=true
